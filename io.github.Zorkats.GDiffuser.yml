app-id: io.github.Zorkats.GDiffuser
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: g-diffuser-launch

finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=all
  - --filesystem=xdg-download:ro

modules:
  - name: g-diffuser
    buildsystem: simple
    build-commands:
      - mkdir -p /app/lib/g-diffuser
      - cp -a src/. /app/lib/g-diffuser/
      - find /app/lib/g-diffuser -maxdepth 2 -type f -name 'G-Diffuser' -exec chmod +x {} +
      - install -Dm755 g-diffuser-launch /app/bin/g-diffuser-launch
      - install -Dm644 io.github.Zorkats.GDiffuser.desktop -t /app/share/applications
    sources:
      - type: archive
        url: https://github.com/Zorkats/G-Diffuser/releases/download/v1.1.0/G-Diffuser-v1.1.0-linux-x64.tar.gz
        sha256: 5b13b89323344bd9a65ba51fe48dfb52c76e84392e12c3e9873e557c359992a4
        strip-components: 0
        dest: src
      - type: script
        dest-filename: g-diffuser-launch
        commands:
          - D="${XDG_DATA_HOME:-$HOME/.local/share}/g-diffuser"
          - mkdir -p "$D"
          - cp -a /app/lib/g-diffuser/. "$D/"
          - BIN=$(find "$D" -maxdepth 2 -type f -name 'G-Diffuser' | head -n 1)
          - cd "$(dirname "$BIN")"
          - exec ./G-Diffuser "$@"
      - type: file
        path: io.github.Zorkats.GDiffuser.desktop
