app-id: io.github.Zorkats.GDiffuser
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: g-diffuser-launch

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  # Gamepads. (--device=input would be tighter but needs Flatpak >= 1.15.6.)
  - --device=all
  # The Linux build has no file picker: you drag & drop the ROM / disk image / IPL onto the
  # first-boot window. Drops carry host paths, so the sandbox must be able to read them.
  # For other locations: flatpak override --user --filesystem=/path:ro io.github.Zorkats.GDiffuser
  - --filesystem=xdg-download:ro
  # No --share=network on purpose: the in-game updater would replace files that the Flatpak
  # manages. Updates come through Flatpak.

modules:
  - name: g-diffuser
    buildsystem: simple
    build-commands:
      # Read-only copy of the release, plus two files the launcher uses to install it into the
      # app's data directory: the list of program files, and an id that changes per build.
      - mkdir -p /app/lib/g-diffuser
      - cp -a src/. /app/lib/g-diffuser/
      - (cd src && { find . -mindepth 1 -maxdepth 1 ! -name shaders -printf '%P\n'; find shaders -mindepth 1 -maxdepth 1; }) | sort > /app/lib/g-diffuser/.managed
      - (cd src && find . -type f | sort | xargs sha256sum) | sha256sum | cut -d' ' -f1 > /app/lib/g-diffuser/.install-id
      - install -Dm755 g-diffuser-launch /app/bin/g-diffuser-launch
      - install -Dm644 io.github.Zorkats.GDiffuser.desktop -t /app/share/applications
      - install -Dm644 io.github.Zorkats.GDiffuser.metainfo.xml -t /app/share/metainfo
      - install -Dm644 gdiffuser-icon.png /app/share/icons/hicolor/192x192/apps/io.github.Zorkats.GDiffuser.png
    sources:
      - type: archive
        url: https://github.com/Zorkats/G-Diffuser/releases/download/v1.2.0/G-Diffuser-v1.2.0-linux-x64.tar.gz
        sha256: 5ad538873dbb339acb8bc8ba47a952596a85619e21839122b956a0b031429da1
        strip-components: 1   # drop the tarball's top-level G-Diffuser/ folder
        dest: src
      - type: file
        url: https://raw.githubusercontent.com/Zorkats/G-Diffuser/v1.2.0/assets/branding/gdiffuser-icon.png
        sha256: 8cec7510c0726535dde5dee5a0e118176cf900930cfc293912855bb914df7213
        dest-filename: gdiffuser-icon.png
      - type: file
        path: g-diffuser-launch
      - type: file
        path: io.github.Zorkats.GDiffuser.desktop
      - type: file
        path: io.github.Zorkats.GDiffuser.metainfo.xml
